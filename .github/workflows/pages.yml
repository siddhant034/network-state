name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # A manually dispatched run on a feature branch may validate the workflow,
    # but must never publish a non-main revision to the public Pages site.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify immutable GitHub Actions pins
        run: node scripts/check-workflow-pins.mjs
      - name: Verify least-privilege workflow permissions
        run: node scripts/check-workflow-permissions.mjs
      - name: Install dependencies from the committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Test published-site verifier and artifact preflight
        run: node --test scripts/pages-smoke-test.test.mjs scripts/pages-build-smoke-test.test.mjs
      - name: Build
        run: npm run build
      - name: Preflight the exact Pages artifact
        run: node scripts/pages-build-smoke-test.mjs dist
      - name: Enforce dependency audit
        run: npm audit --audit-level=low
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Checkout smoke-test script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Smoke-test the published site and its assets
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/pages-smoke-test.mjs
