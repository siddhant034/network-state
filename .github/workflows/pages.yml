name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # A manually dispatched run on a feature branch may validate the workflow,
    # but must never publish a non-main revision to the public Pages site.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify immutable GitHub Actions pins
        run: node scripts/check-workflow-pins.mjs
      - name: Verify least-privilege workflow permissions
        run: node scripts/check-workflow-permissions.mjs
      - name: Install dependencies from the committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Test published-site verifier and artifact preflight
        run: node --test scripts/pages-smoke-test.test.mjs scripts/pages-build-smoke-test.test.mjs
      - name: Build
        run: npm run build
      - name: Preflight the exact Pages artifact
        run: node scripts/pages-build-smoke-test.mjs dist
      - name: Enforce dependency audit
        run: npm audit --audit-level=low
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    steps:
      - name: Checkout smoke-test script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Smoke-test the published site and its assets
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/pages-smoke-test.mjs

  live-browser-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [deploy, smoke]
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout live smoke script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from the committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for the published-site smoke
        run: npx playwright install --with-deps chromium
      - name: Exercise core flows on the published site
        env:
          PAGES_URL: \${{ needs.deploy.outputs.page_url }}
        run: node scripts/pages-live-browser-smoke.mjs
