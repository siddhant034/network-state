name: CI

on:
  pull_request:
  push:
    branches: [main]

# Keep expensive browser matrices focused on the newest code for each PR/ref.
# PR runs share a group by PR number; main pushes share a group by ref.
concurrency:
  group: network-state-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify immutable GitHub Actions pins
        run: node scripts/check-workflow-pins.mjs
      - name: Verify least-privilege workflow permissions
        run: node scripts/check-workflow-permissions.mjs
      - name: Test workflow permission policy
        run: npm run test:workflow-permissions
      - name: Install dependencies from the committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Test workflow pin policy
        run: npm run test:workflow-pins
      - name: Test published-site smoke verifier
        run: node --test scripts/pages-smoke-test.test.mjs scripts/pages-build-smoke-test.test.mjs
      - name: Build
        run: npm run build
      - name: Preflight the built GitHub Pages artifact
        run: node scripts/pages-build-smoke-test.mjs dist
      - name: Capture dependency audit report
        if: always()
        run: npm audit --json > npm-audit.json || true
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce clean dependency audit
        run: node -e 'const report = require("./npm-audit.json"); const summary = report.metadata?.vulnerabilities; if (!summary) throw new Error("npm audit did not return a vulnerability summary"); if (summary.total !== 0) { console.error("Dependency audit found vulnerabilities:", summary); process.exit(1); }'

  browser-e2e:
    name: Browser checks (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            engine: chromium
          - project: firefox
            engine: firefox
          - project: webkit
            engine: webkit
          - project: webkit-iphone
            engine: webkit
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies from the committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Run browser checks
        run: npm run test:e2e -- --project=${{ matrix.project }}
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
