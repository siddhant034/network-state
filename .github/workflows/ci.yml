name: CI

on:
  pull_request:
  push:
    branches: [main]

# Keep expensive browser matrices focused on the newest code for each PR/ref.
# PR runs share a group by PR number; main pushes share a group by ref.
concurrency:
  group: network-state-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies from the committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Test published-site smoke verifier
        run: node --test scripts/pages-smoke-test.test.mjs scripts/pages-build-smoke-test.test.mjs
      - name: Build
        run: npm run build
      - name: Preflight the built GitHub Pages artifact
        run: node scripts/pages-build-smoke-test.mjs dist
      - name: Capture dependency audit report
        if: always()
        run: npm audit --json > npm-audit.json || true
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce clean dependency audit
        run: node -e 'const report = require("./npm-audit.json"); const summary = report.metadata?.vulnerabilities; if (!summary) throw new Error("npm audit did not return a vulnerability summary"); if (summary.total !== 0) { console.error("Dependency audit found vulnerabilities:", summary); process.exit(1); }'

  browser-e2e:
    name: Browser checks (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies from the committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser checks
        run: npm run test:e2e -- --project=${{ matrix.browser }}
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
